<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aashray</title>
  <meta name="description" content="Aashray: our website is coming soon.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      color: #f5f1ea;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 50% 0%, #2a1f3d 0%, #0e0b14 60%);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.5rem, 10vw, 5rem);
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, #ffd6a5, #ff9a8b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p {
      margin: 0;
      font-size: clamp(1rem, 3vw, 1.25rem);
      opacity: 0.75;
    }
    .badge {
      display: inline-block;
      margin-top: 28px;
      padding: 8px 18px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <main>
    <h1>Aashray</h1>
    <p>Something meaningful is on its way.</p>
    <span class="badge">🚧 Work in progress</span>
  </main>
</body>
</html>
